site_name: Peyton Pope
site_url: https://peytonjpope.com
theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: Roboto
  icon:
    logo: material/alpha-p-box
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.select
    - navigation.footer

  palette:
    scheme: slate
    primary: blue grey
    accent: deep purple
    # # Dark Mode
    # - media: "(prefers-color-scheme: dark)"
    #   scheme: slate
    #   toggle: 
    #     icon: material/lightbulb-outline
    #     name: Dark mode
    #   primary: blue grey
    #   accent: deep purple
    
    # Light Mode
    # - media: "(prefers-color-scheme: light)"
    #   scheme: default
    #   toggle: 
    #     icon: material/lightbulb
    #     name: Light mode
    #   primary: blue grey
    #   accent: deep purple
extra:
  generator: false 
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/peyton-pope/
    - icon: fontawesome/brands/github
      link: https://github.com/peytonjpope

nav:
  - Home: index.md
  - About Me: about.md
  - Projects:
    - SignCraft WebApp: projects/signcraft.md
    - Playoff ML Model: projects/cfp-predictor.md
    - Film Ratings Database: projects/pmdb.md
    - Campaign Predictor: projects/campaign-ds.md
    - Spotify Pattern Mining: projects/spotify-ds.md
    - Streamlit TenniSim: projects/tennis-sim.md
    - Church Map Viz: projects/churchds.md
    - MyBlocker Extension: projects/myblocker.md
    - Web Bracket Generator: projects/cfpbracket.md
    - Portfolio Website: projects/portfolio.md
extra_css:
  - assets/style.css

copyright: v2.0.3